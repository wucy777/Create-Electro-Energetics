# Connected-texture frame for Clear Glass.
#
# Clear Glass is deliberately invisible so it can be used as an invisible
# partition. Used as a copycat material, though, a fully invisible block is
# impossible to lay out: you cannot see where one panel ends and the next
# begins. This gives it a frame around the outer perimeter of a contiguous sheet
# and nothing on the shared interior edges.
#
# Read by Continuity and other OptiFine-format connected-texture mods. It is
# inert without one, in which case the block simply stays fully invisible.
#
# matchTiles, deliberately, and NOT matchBlocks. A copycat block IS a copycat
# block - its state is copycats:copycat_slab or similar - but it bakes the
# material's model, so its quads carry this sprite. Matching on the sprite
# therefore covers both the real block and every copycat panel built out of it,
# whereas matching on the block id would only ever catch the real block. Using
# one matcher instead of two also avoids depending on how a given implementation
# combines them.
#
# ctm_compact picks a tile from the neighbours that share this texture, so a
# sheet gets one continuous frame around its edge instead of a frame per block.
method=ctm_compact
matchTiles=electroenergetics:clear_glass
tiles=0-4
